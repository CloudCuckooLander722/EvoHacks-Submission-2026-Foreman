[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foreman"
version = "0.1.0"
description = "Bulk AI automation: plan once with an LLM, decide with Jev, escalate only when unsure."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "openai>=1.40",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["foreman*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls real APIs; needs keys in .env"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
